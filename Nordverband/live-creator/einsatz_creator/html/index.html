<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatz-Creator</title>
    <link rel="stylesheet" href="vendor/fontawesome/css/fontawesome.min.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/solid.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Creator -->
    <div id="editor" class="hidden">
        <!-- Uebersicht: Szenarien, aktive Einsaetze, Zufall (ohne Kamera) -->
        <div id="hub" class="hidden">
            <header id="hubTop"></header>
            <div id="hubBody" class="scroll"></div>
        </div>
        <!-- Szene bauen: freie Kamera -->
        <div id="scene" class="hidden">
            <header id="topbar"></header>
            <nav id="rail"></nav>
            <section id="panel">
                <div id="panelHead"></div>
                <div id="panelBody" class="scroll"></div>
            </section>
            <main id="viewport"></main>
            <aside id="inspector" class="hidden"></aside>
            <footer id="statusbar"></footer>
        </div>
        <div id="wizard" class="hidden"></div>
        <div id="dialog" class="hidden"></div>
    </div>

    <!-- Einsatzkraefte vor Ort -->
    <div id="prompt" class="hidden"></div>
    <div id="subtitles"></div>
    <div id="progress" class="hidden">
        <div class="label"><i class="fa-solid fa-hourglass-half"></i><span></span></div>
        <div class="bar"><div class="fill"></div></div>
        <div class="hint"></div>
    </div>
    <div id="actionMenu" class="hidden"></div>
    <div id="patientCard" class="card hidden"></div>
    <div id="infoPanel" class="hidden"></div>

    <div id="toasts"></div>

    <script src="app.js"></script>
</body>
</html>
